<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jump Kids Level Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <div id="leftPanel">
      <h2>Level</h2>
      <button id="newLevel">New Level</button>
      <button id="loadLevel">Load Level</button>
      <input type="file" id="fileInput" accept=".json" style="display:none" />
      <div id="levelName"></div>
    </div>
    <div id="editorArea">
      <canvas id="grid" width="640" height="480"></canvas>
    </div>
    <div id="rightPanel">
      <div class="tabs">
        <button class="tab active" data-tab="base">Base Tiles</button>
        <button class="tab" data-tab="features">Features</button>
        <button class="tab" data-tab="enemies">Enemies</button>
        <button class="tab" data-tab="goals">Goals</button>
      </div>
      <div id="palette"></div>
      <button id="saveLevel">Save Level</button>
    </div>
  </div>
  <script src="editor.js"></script>
</body>
</html>
