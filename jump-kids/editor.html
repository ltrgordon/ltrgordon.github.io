<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Jump Kids Level Editor</title>
<link rel="stylesheet" href="styles.css">
<style>
  body{background:#eef;margin:0;font-family:system-ui;}
  #editorWrap{display:flex;gap:12px;padding:10px;}
  #palette{display:flex;flex-wrap:wrap;width:160px;gap:4px;}
  #palette button{width:32px;height:32px;line-height:32px;text-align:center;}
  #tools{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  canvas{border:1px solid #555;touch-action:none;}
</style>
</head>
<body>
<div id="editorWrap">
  <div>
    <canvas id="editorCanvas" width="960" height="704" aria-label="Level editor"></canvas>
    <div id="tools">
      <button id="newBtn">New</button>
      <button id="saveBtn">Save</button>
      <select id="backdropSelect">
        <option value="hills">Hills</option>
        <option value="cave">Cave</option>
      </select>
      <select id="levelLoad"></select>
      <button id="loadBtn">Load</button>
      <button id="backBtn">Back</button>
    </div>
  </div>
  <div id="palette"></div>
</div>
<script type="module" src="editor.js"></script>
</body>
</html>
